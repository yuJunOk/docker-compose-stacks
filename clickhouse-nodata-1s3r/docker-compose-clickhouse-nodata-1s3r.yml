version: '3.8'
services:
  clickhouse-node1:
    image: clickhouse/clickhouse-server
    restart: always
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.101
    volumes:
      - D:\docker_CH\clickhouse-nodata-1s3r\node1\conf\config.xml:/etc/clickhouse-server/config.xml
      - D:\docker_CH\clickhouse-nodata-1s3r\node1\conf\users.xml:/etc/clickhouse-server/users.xml
    ports:
      - "18124:8123"
      - "19001:9000"
    environment:
      CLICKHOUSE_DB: 'default'
      CLICKHOUSE_USER: 'wzkj'
      CLICKHOUSE_PASSWORD: '1qazXSW@123'
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3

  clickhouse-node2:
    image: clickhouse/clickhouse-server
    restart: always
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.102
    volumes:
      - D:\docker_CH\clickhouse-nodata-1s3r\node2\conf\config.xml:/etc/clickhouse-server/config.xml
      - D:\docker_CH\clickhouse-nodata-1s3r\node2\conf\users.xml:/etc/clickhouse-server/users.xml
    ports:
      - "18125:8123"
      - "19002:9000"
    environment:
      CLICKHOUSE_DB: 'default'
      CLICKHOUSE_USER: 'wzkj'
      CLICKHOUSE_PASSWORD: '1qazXSW@123'
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3

  clickhouse-node3:
    image: clickhouse/clickhouse-server
    restart: always
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.103
    volumes:
      - D:\docker_CH\clickhouse-nodata-1s3r\node3\conf\config.xml:/etc/clickhouse-server/config.xml
      - D:\docker_CH\clickhouse-nodata-1s3r\node3\conf\users.xml:/etc/clickhouse-server/users.xml
    ports:
      - "18126:8123"
      - "19003:9000"
    environment:
      CLICKHOUSE_DB: 'default'
      CLICKHOUSE_USER: 'wzkj'
      CLICKHOUSE_PASSWORD: '1qazXSW@123'
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3

  zookeeper1:
    image: zookeeper:3.6.3
    restart: always
    hostname: zookeeper1
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.11
    ports:
      - "2181:2181"
      - "8081:8080"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
      ZOO_AUTOPURGE_PURGEINTERVAL: 24
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 5
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
      ZOO_STANDALONE_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]

  zookeeper2:
    image: zookeeper:3.6.3
    restart: always
    hostname: zookeeper2
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.12
    ports:
      - "2182:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    depends_on:
      - zookeeper1

  zookeeper3:
    image: zookeeper:3.6.3
    restart: always
    hostname: zookeeper3
    networks:
      clickhouse_1s3r_net:
        ipv4_address: 172.22.0.13
    ports:
      - "2183:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    depends_on:
      - zookeeper1

networks:
  clickhouse_1s3r_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1
